name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"shun968" \
            /o:"shun968" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/bin/**,**/obj/**" \
            /d:sonar.cpd.exclusions="architectures/clean/**" \
            /d:sonar.cs.opencover.reportsPaths="architectures/*/tests/*/coverage.opencover.xml"
          dotnet build architectures/layered/LayeredArchitecture.sln
          dotnet build architectures/clean/CleanArchitecture.sln
          for project in \
            architectures/layered/tests/Domain.Tests/LayeredArchitecture.Domain.Tests.csproj \
            architectures/layered/tests/Application.Tests/LayeredArchitecture.Application.Tests.csproj \
            architectures/layered/tests/Infrastructure.Tests/LayeredArchitecture.Infrastructure.Tests.csproj \
            architectures/clean/tests/Domain.Tests/CleanArchitecture.Domain.Tests.csproj \
            architectures/clean/tests/Application.Tests/CleanArchitecture.Application.Tests.csproj \
            architectures/clean/tests/Infrastructure.Tests/CleanArchitecture.Infrastructure.Tests.csproj; do
            dotnet test "$project" \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput=./coverage.opencover.xml
          done
          dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
