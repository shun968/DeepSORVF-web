version: "3"

vars:
  SOLUTION: LayeredArchitecture.sln
  UNIT_TEST_LAYERS: Domain Application Infrastructure
  ARCHITECTURE_TEST_PROJ: tests/Architecture.Tests/LayeredArchitecture.Architecture.Tests.csproj
  WEB_INTEGRATION_TEST_PROJ: tests/Web.IntegrationTests/LayeredArchitecture.Web.IntegrationTests.csproj
  WEB_PROJ_DIR: src/Web
  COVERAGE_DIR: TestResults

tasks:
  build:
    desc: Build the whole solution in one build (all layers together)
    cmds:
      - dotnet build {{.SOLUTION}}

  run:
    desc: Serve the vessel tracking viewer on http://localhost:5000 (PORT to change) — the page runs the pipeline and draws the AIS positions, tracks and fusion results frame by frame, over the video when there is one; its form opens on the FVessel clip in the repository root's clip-01/ (with its video) when that is present, otherwise on the bundled synthetic sample-data (no video); override AIS_DIR, CAMERA_PARAMS, VIDEO_PATH, START_TIME, FRAME_COUNT, FRAME_INTERVAL_SECONDS or RESULT_DIR to open other data
    vars:
      PORT: '{{.PORT | default "5000"}}'
      # The FVessel test clip, placed at the repository root (gitignored, see the root README).
      CLIP_DIR: '{{.CLIP_DIR | default (print (dir (dir .TASKFILE_DIR)) "/clip-01")}}'
      CLIP_VIDEO:
        sh: ls "{{.CLIP_DIR}}"/*.mp4 2>/dev/null | head -n 1 || true
      CLIP_CAMERA:
        sh: ls "{{.CLIP_DIR}}"/*.txt 2>/dev/null | head -n 1 || true
      # The clip's video file name holds its start and end in local time (UTC+8, where FVessel
      # was recorded): <yyyy_MM_dd_HH_mm_ss of the start>_<HH_mm_ss of the end>_....mp4
      CLIP_START:
        sh: |
          basename "{{.CLIP_VIDEO}}" | sed -nE 's/^([0-9]{4})_([0-9]{2})_([0-9]{2})_([0-9]{2})_([0-9]{2})_([0-9]{2})_.*/\1-\2-\3T\4:\5:\6+08:00/p'
      CLIP_SECONDS:
        sh: |
          name=$(basename "{{.CLIP_VIDEO}}")
          day=$(echo "$name" | sed -nE 's/^([0-9]{4})_([0-9]{2})_([0-9]{2})_.*/\1-\2-\3/p')
          start=$(echo "$name" | sed -nE 's/^[0-9]{4}_[0-9]{2}_[0-9]{2}_([0-9]{2})_([0-9]{2})_([0-9]{2})_.*/\1:\2:\3/p')
          end=$(echo "$name" | sed -nE 's/^([0-9]+_){6}([0-9]{2})_([0-9]{2})_([0-9]{2})_.*/\2:\3:\4/p')
          if [ -n "$end" ]; then echo $(( $(date -d "$day $end" +%s) - $(date -d "$day $start" +%s) )); fi
      # Use the clip only when it is complete and no other AIS data or calibration was asked for.
      USE_CLIP: '{{if and .CLIP_VIDEO .CLIP_CAMERA .CLIP_START (not .AIS_DIR) (not .CAMERA_PARAMS)}}true{{end}}'
      AIS_DIR: '{{if .AIS_DIR}}{{.AIS_DIR}}{{else if .USE_CLIP}}{{.CLIP_DIR}}/ais{{else}}{{.TASKFILE_DIR}}/sample-data/ais{{end}}'
      CAMERA_PARAMS: '{{if .CAMERA_PARAMS}}{{.CAMERA_PARAMS}}{{else if .USE_CLIP}}{{.CLIP_CAMERA}}{{else}}{{.TASKFILE_DIR}}/sample-data/camera.txt{{end}}'
      VIDEO_PATH: '{{if .VIDEO_PATH}}{{.VIDEO_PATH}}{{else if .USE_CLIP}}{{.CLIP_VIDEO}}{{end}}'
      START_TIME: '{{if .START_TIME}}{{.START_TIME}}{{else if .USE_CLIP}}{{.CLIP_START}}{{else}}2021-01-01T12:00:00Z{{end}}'
      FRAME_COUNT: '{{if .FRAME_COUNT}}{{.FRAME_COUNT}}{{else if and .USE_CLIP .CLIP_SECONDS}}{{.CLIP_SECONDS}}{{else if .USE_CLIP}}100{{else}}3{{end}}'
      FRAME_INTERVAL_SECONDS: '{{if .FRAME_INTERVAL_SECONDS}}{{.FRAME_INTERVAL_SECONDS}}{{else if .USE_CLIP}}1{{else}}60{{end}}'
      RESULT_DIR: '{{.RESULT_DIR | default ""}}'
    env:
      RunDefaults__AisDataDirectory: '{{.AIS_DIR}}'
      RunDefaults__CameraParametersPath: '{{.CAMERA_PARAMS}}'
      RunDefaults__VideoPath: '{{.VIDEO_PATH}}'
      RunDefaults__StartTime: '{{.START_TIME}}'
      RunDefaults__FrameCount: '{{.FRAME_COUNT}}'
      RunDefaults__FrameIntervalSeconds: '{{.FRAME_INTERVAL_SECONDS}}'
      RunDefaults__ResultDirectory: '{{.RESULT_DIR}}'
    cmds:
      - echo "Open http://localhost:{{.PORT}}/ in a browser once the app has started (Ctrl+C to stop)."
      - dotnet run --project {{.WEB_PROJ_DIR}} --urls http://localhost:{{.PORT}}

  test:
    desc: Run tests for all layers
    cmds:
      - dotnet test {{.SOLUTION}}

  test:unit:
    desc: Run every layer's unit tests (Domain, Application, Infrastructure), each measuring line/branch/method coverage of the layer it tests and failing if any falls below the threshold (default 100); lcov.info viewable in Coverage Gutters, and a shareable HTML report per layer is generated via genhtml (TestResults/<Layer>.Tests/report/index.html)
    vars:
      THRESHOLD: '{{.THRESHOLD | default "100"}}'
    cmds:
      - for: { var: UNIT_TEST_LAYERS }
        cmd: dotnet test tests/{{.ITEM}}.Tests/LayeredArchitecture.{{.ITEM}}.Tests.csproj /p:CollectCoverage=true '/p:Include="[LayeredArchitecture.{{.ITEM}}]*"' /p:CoverletOutputFormat=\"lcov,cobertura\" /p:CoverletOutput=../../{{.COVERAGE_DIR}}/{{.ITEM}}.Tests/ /p:Threshold={{.THRESHOLD}} /p:ThresholdType=\"line,branch,method\" /p:ThresholdStat=total
      - for: { var: UNIT_TEST_LAYERS }
        cmd: genhtml {{.COVERAGE_DIR}}/{{.ITEM}}.Tests/coverage.info -o {{.COVERAGE_DIR}}/{{.ITEM}}.Tests/report

  test:architecture:
    desc: Verify layer dependency direction (NetArchTest) — e.g. Domain must not depend on Application/Infrastructure/Web
    cmds:
      - dotnet test {{.ARCHITECTURE_TEST_PROJ}}

  test:web:integration:
    desc: Run Web layer integration tests (WebApplicationFactory, full HTTP round-trip against real AIS files on disk)
    cmds:
      - dotnet test {{.WEB_INTEGRATION_TEST_PROJ}}

  lint:
    desc: Lint the whole solution (formatting, code style, analyzers) without modifying files
    cmds:
      - dotnet format {{.SOLUTION}} --verify-no-changes --severity warn

  clean:
    desc: Clean all build outputs
    cmds:
      - dotnet clean {{.SOLUTION}}
      - rm -rf {{.COVERAGE_DIR}}
