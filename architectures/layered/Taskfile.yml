version: "3"

vars:
  SOLUTION: LayeredArchitecture.sln
  DOMAIN_PROJ: src/Domain/LayeredArchitecture.Domain.csproj
  DOMAIN_TEST_PROJ: tests/Domain.Tests/LayeredArchitecture.Domain.Tests.csproj
  COVERAGE_DIR: TestResults

tasks:
  build:
    desc: Build the whole solution in one build (all layers together)
    cmds:
      - dotnet build {{.SOLUTION}}

  build:domain:
    desc: Compile the Domain layer only
    cmds:
      - dotnet build {{.DOMAIN_PROJ}}

  test:
    desc: Run tests for all layers
    cmds:
      - dotnet test {{.SOLUTION}}

  test:domain:unit:
    desc: Run Domain layer unit tests with line/branch/method coverage, failing if any falls below the threshold (default 100); lcov.info viewable in Coverage Gutters, and a shareable HTML report is generated via genhtml (TestResults/Domain.Tests/report/index.html)
    vars:
      THRESHOLD: "100"
    cmds:
      - dotnet test {{.DOMAIN_TEST_PROJ}} /p:CollectCoverage=true /p:CoverletOutputFormat=\"lcov,cobertura\" /p:CoverletOutput=../../{{.COVERAGE_DIR}}/Domain.Tests/ /p:Threshold={{.THRESHOLD}} /p:ThresholdType=\"line,branch,method\" /p:ThresholdStat=total
      - genhtml {{.COVERAGE_DIR}}/Domain.Tests/coverage.info -o {{.COVERAGE_DIR}}/Domain.Tests/report

  # 結合テストを追加する際は、xUnitプロジェクトを <Layer>.IntegrationTests という名前で
  # tests/ 配下に作成し、test:domain:integration を追加すること。

  lint:
    desc: Lint the whole solution (formatting, code style, analyzers) without modifying files
    cmds:
      - dotnet format {{.SOLUTION}} --verify-no-changes --severity warn

  metrics:
    desc: Measure cyclomatic complexity per method in the Domain layer and fail if any method exceeds the threshold (default 10)
    cmds:
      - dotnet run --project tools/ComplexityAnalyzer -- {{.DOMAIN_PROJ_DIR}}
    vars:
      DOMAIN_PROJ_DIR: src/Domain

  clean:
    desc: Clean all build outputs
    cmds:
      - dotnet clean {{.SOLUTION}}
      - rm -rf {{.COVERAGE_DIR}}
